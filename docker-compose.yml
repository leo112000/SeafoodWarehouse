services:
  # 1. Cơ sở dữ liệu PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: seafood_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-SeafoodWarehouseDb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Password123!}
    ports:
      # Khóa cổng 5432: chỉ cho phép máy nội bộ (localhost) kết nối, chặn kẻ lạ từ Wi-Fi/Internet
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-SeafoodWarehouseDb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend .NET 10 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seafood_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME:-SeafoodWarehouseDb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-Password123!}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-SeafoodWarehouseSecureJwtSigningSecretKey_2026_UltraProtected_Min256Bits}
    ports:
      # Chỉ mở cổng 5000 cho localhost để test API/Scalar nội bộ
      - "127.0.0.1:5000:5000"

  # 3. Frontend React (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seafood_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Cổng 3000 phục vụ web, đi qua Nginx bảo mật
      - "3000:80"

volumes:
  pgdata:
