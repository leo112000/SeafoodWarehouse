<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Quản Lý Kho Hải Sản</title>
  <script>
    (function() {
      // 1. Chặn lỗi từ Extension trình duyệt / Công cụ đo Web Vitals bên ngoài (reportAllChanges, startTime)
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        if (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);

      var origOnError = window.onerror;
      window.onerror = function(msg) {
        if (typeof msg === 'string' && (msg.indexOf('startTime') !== -1 || msg.indexOf('reportAllChanges') !== -1)) {
          return true;
        }
        if (origOnError) return origOnError.apply(this, arguments);
      };

      // 2. Lọc các thông báo Warning deprecation của Ant Design v6
      var isIgnoredLog = function(args) {
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          if (typeof a === 'string' && (
            a.indexOf('[antd:') !== -1 || 
            a.indexOf('is deprecated. Please use') !== -1 || 
            a.indexOf('startTime') !== -1 || 
            a.indexOf('reportAllChanges') !== -1
          )) {
            return true;
          }
        }
        return false;
      };
      var origWarn = console.warn;
      console.warn = function() {
        if (isIgnoredLog(arguments)) return;
        origWarn.apply(console, arguments);
      };
      var origError = console.error;
      console.error = function() {
        if (isIgnoredLog(arguments)) return;
        origError.apply(console, arguments);
      };
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
